# Config file for an example Majora's Mask: Recompiled mod.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod. Pick something long enough that it'll never be the same as any other mod.
# The name displayed in the mod management menu is separate from this so this doesn't need to be human readable.
id = "mm_roll_master"

# Version of this mod.
version = "1.3.2"

# The name that will show up for this mod in the mod menu. This should be human readable.
display_name = "Roll Master"

# The description that will show up when this mod is displayed in the mod menu. This should be human readable.
description =  """
Link has become a master of somersaults!

This mod improves Link's rolling by removing the brief pause between rolls, allowing for fluid, continuous movement. It also comes with many additional features that are totally configurable.

Configurable Features:
- Bunny Hood Roll (includes Better Bunny Hood support)
- Roll Turning
- Roll Input Buffer
- Quiet Link
- No Interruptions
- Dust Particles
"""

# A short description that will show up in this mod's entry in the mod list. This should be human readable and kept short
# to prevent it from being cut off due to the limited space.
short_description = "Many rolling related tweaks"

# Authors of this mod.
authors = [ "Keanine" ]

# ID of the target recomp game.
game_id = "mm"

# Minimum version of the target recomp (e.g. Zelda 64: Recompiled) that this mod can run on.
minimum_recomp_version = "1.2.1"

# Dependency mods. Each entry is the mod's ID and then an optional minimum version of the dependency mod.
dependencies = [
    
]

# Optional dependency mods. This has the same format as `dependencies`, but the game will still start if dependencies in this
# list aren't present. You can query the presence of a given dependency by using `recomp_is_dependency_met` in recomputils.h.
# Calling a function imported from an optional dependency that isn't present will trigger an error.
optional_dependencies = [
    "mm_recomp_better_bunny:1.1.0"
]

# Native libraries (e.g. DLLs) and the functions they export.
native_libraries = [
# Example native library:
#    { name = "my_native_library", funcs = ["my_native_library_function"] }
]

# Inputs to the mod tool.
[inputs]

# Input elf file to generate a mod from.
elf_path = "build/mod.elf"

# Output mod filename.
mod_filename = "mm_roll_master"

# Reference symbol files.
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]

# Additional files to include in the mod.
additional_files = [ "thumb.dds" ]

[[manifest.config_options]]
id = "bunny_roll"
name = "Bunny Hood Roll"
description = """
Roll even faster with the bunny hood!

Your speed while jumping will be clamped, so you will jump the same distance as the original game, but you can enjoy the benefits of faster movement with this option.
"""
type = "Enum"
options = [ "Disabled", "Enabled" ]
default = "Enabled"

[[manifest.config_options]]
id = "roll_turning"
name = "Roll Turning"
description = "Allows you to turn slightly while rolling, similar to Twilight Princess. Roll turning could cause issues with speedrun tech, so it's recommended to only disable it for those reasons."
type = "Enum"
options = [ "Disabled", "Enabled" ]
default = "Enabled"

[[manifest.config_options]]
id = "input_buffer"
name = "Roll Input Buffer"
description = "Add an input buffer to chain together rolls more easily, keeping your max speed high."
type = "Enum"
options = [ "Disabled", "Enabled" ]
default = "Enabled"

[[manifest.config_options]]
id = "quiet_link"
name = "Quiet Link"
description = "Silence Link's shouting whenever he rolls."
type = "Enum"
options = [ "Disabled", "Enabled" ]
default = "Enabled"

[[manifest.config_options]]
id = "no_interruptions"
name = "No Interruptions"
description = "Link doesn't try to talk to someone or pickup something in the middle of a roll."
type = "Enum"
options = [ "Disabled", "Enabled" ]
default = "Enabled"

[[manifest.config_options]]
id = "dust_particles"
name = "Dust Particles"
description = "Spawn dust particles when you're rolling around at the speed of sound. This adds a sense of speed and a gives the roll a little more impact."
type = "Enum"
options = [ "Disabled", "Enabled" ]
default = "Enabled"